name: Mutation testing

# Roda à parte do CI de PR (mutação é lento) — semanal e sob demanda.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  stryker:
    name: Stryker (mutation testing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - name: Publica relatório do Stryker
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
